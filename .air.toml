# Live reload for `make dev-api`: rebuilds and restarts the panel when Go code changes.
# The BERTH_* environment comes from the Makefile.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/panel ./cmd/panel"
  bin = "./tmp/panel"
  args_bin = ["serve"]
  include_dir = ["cmd", "internal"]
  include_ext = ["go", "sql"]
  exclude_dir = ["internal/webui/dist"]
  exclude_regex = ["_test\\.go$"]
  delay = 300
  # Graceful stop: SIGINT first so open SSE streams and the database close cleanly.
  send_interrupt = true
  kill_delay = "5s"
  stop_on_error = true

[log]
  main_only = true

[misc]
  clean_on_exit = true
