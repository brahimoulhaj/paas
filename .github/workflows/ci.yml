name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web app (typecheck and build)
        working-directory: web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go vet
        run: go vet ./...
      # -short skips the tests that need a Docker daemon and a Caddy container.
      - name: Go test
        run: go test -short -race ./...

      - name: Installer renders
        run: make installer VERSION=ci && sh -n bin/install.sh
