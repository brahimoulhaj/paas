name: Release

# Push a tag like v0.1.0 to publish ghcr.io/<owner>/<repo>:0.1.0 (and :latest) for
# amd64 and arm64, and a GitHub release with the matching install.sh. Installed panels
# see the new version tag and offer to update.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # the GitHub release
  packages: write # the image on ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Version from the tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(steps.v.outputs.version, '-') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Installer
        run: make installer IMAGE=${{ env.IMAGE }} VERSION=${{ steps.v.outputs.version }}

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "${{ steps.v.outputs.version }}" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" bin/install.sh $pre --generate-notes --title "$GITHUB_REF_NAME"
